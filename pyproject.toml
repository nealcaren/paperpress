[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpress"
version = "0.1.0"
description = "Turn a run of dated newspaper or magazine issues into a readable, searchable, citable archive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Neal Caren", email = "neal.caren@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Sociology :: History",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "click>=8.0",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "newspaper-ocr[doclayout]==0.10.0",
    "pagefind[bin]>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
paperpress = "paperpress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
