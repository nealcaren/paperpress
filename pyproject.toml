[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpress"
dynamic = ["version"]
description = "Turn runs of old newspapers and magazines into a searchable, citable archive, a research corpus, and a website"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Neal Caren", email = "neal.caren@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Sociology :: History",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "click>=8.0",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "newspaper-ocr[doclayout]==0.10.0",
    "pagefind[bin]>=1.5",
]

keywords = ["newspapers", "periodicals", "ocr", "digital humanities", "archives", "iiif",
            "internet archive", "corpus"]

[project.urls]
Homepage = "https://github.com/nealcaren/paperpress"
Demo = "https://nealcaren.github.io/paperpress-demo/"
Issues = "https://github.com/nealcaren/paperpress/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
paperpress = "paperpress.cli:main"

[tool.setuptools.dynamic]
version = {attr = "paperpress.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
